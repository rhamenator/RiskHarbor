services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: riskharbor
      POSTGRES_PASSWORD: riskharbor
      POSTGRES_DB: riskharbor
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskharbor"]
      interval: 2s
      timeout: 2s
      retries: 20
