[package]
name = "risk-harbor"
version = "0.1.0"
edition = "2024"
authors = ["Richard M. Hamilton"]
description = "Insurance operations domain core with integer-safe calculations and PostgreSQL persistence"
repository = "https://github.com/rhamenator/RiskHarbor"

[package.metadata.wix]
upgrade-guid = "3D307011-0C16-43DE-A3FE-4FB44898CC45"
path-guid = "EF4868D4-932D-488D-9E5C-4DDC388DD0CA"
license = false
eula = false
product-icon = "wix\\Product.ico"

[dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
